<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4E2"/>
      <stop offset="35%" stop-color="#E5C378"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B23"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201D"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Gold Edge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="rgba(229, 195, 120, 0.25)" stroke-width="1" />

  <!-- Serif Monogram "RL" -->
  <g fill="url(#goldGrad)" filter="url(#softGlow)">
    <!-- R -->
    <path d="M18 43 V21 h9 c3.5 0 6 2 6 5.5 0 2.5-1.5 4.5-4 5.2 L34 43 h-4.5 l-4.5-10.5 h-3 V43 H18 zm4-14.5 h5 c1.8 0 3-1 3-2.5 s-1.2-2.5-3-2.5 h-5 v5 z"/>
    <!-- L -->
    <path d="M36 21 h4 v18 h9 v4 H36 V21 z"/>
  </g>

  <!-- Sparkle Diamond Accent at Top Right -->
  <path d="M47 15 L48.5 18 L51.5 19.5 L48.5 21 L47 24 L45.5 21 L42.5 19.5 L45.5 18 Z" fill="url(#goldGrad)" />
</svg>
